<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cursedshrine.com</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    background: radial-gradient(ellipse at top, #1a0e23 0%, #07060c 60%, #020203 100%);
    color: #d8d0e8;
    font-family: 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 720px; padding: 48px 24px; text-align: center; }

  h1 {
    font-size: 2.6rem;
    letter-spacing: 0.15em;
    color: #b48cff;
    text-shadow: 0 0 8px #8a4dff, 0 0 24px #5a1fbf;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    45% { opacity: 1; }
    47% { opacity: 0.6; }
    49% { opacity: 1; }
    72% { opacity: 0.85; }
    74% { opacity: 1; }
  }

  .tagline {
    margin-top: 10px;
    color: #7a6f96;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
  }

  .glyph {
    font-size: 2rem;
    margin: 18px 0;
    opacity: 0.7;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 40px;
  }

  a.card {
    display: block;
    text-decoration: none;
    color: #e6defc;
    border: 1px solid #3a2a55;
    background: rgba(40, 24, 60, 0.35);
    border-radius: 10px;
    padding: 22px 16px;
    transition: all 0.2s ease;
  }
  a.card:hover {
    border-color: #b48cff;
    background: rgba(138, 77, 255, 0.12);
    box-shadow: 0 0 18px rgba(138, 77, 255, 0.35);
    transform: translateY(-2px);
  }
  a.card .icon { font-size: 1.8rem; display: block; margin-bottom: 8px; }
  a.card .label { font-weight: bold; letter-spacing: 0.04em; }
  a.card .desc { font-size: 0.8rem; color: #9388b0; margin-top: 6px; }

  footer {
    margin-top: 56px;
    font-size: 0.75rem;
    color: #4d4564;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glyph">𓂀</div>
    <h1>CURSED SHRINE</h1>
    <div class="tagline">a small altar of projects, lovingly cursed</div>

    <div class="grid">
      <a class="card" href="https://tictactoe.cursedshrine.com">
        <span class="icon">⚔️</span>
        <span class="label">Tic Tac Toe</span>
        <div class="desc">tictactoe.cursedshrine.com</div>
      </a>
      <a class="card" href="https://minecraft.cursedshrine.com">
        <span class="icon">🪦</span>
        <span class="label">CursedCraft</span>
        <div class="desc">minecraft.cursedshrine.com</div>
      </a>
      <a class="card" href="https://snakeladder.cursedshrine.com">
        <span class="icon">🐍</span>
        <span class="label">Snakes &amp; Ladders</span>
        <div class="desc">snakeladder.cursedshrine.com</div>
      </a>
    </div>

    <footer>established 2026 &middot; built on a raspberry pi &middot; powered by spite</footer>
  </div>
</body>
</html>
